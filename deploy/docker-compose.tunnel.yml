# Public access through a Cloudflare Tunnel, with no port open on the host.
#   docker network create homelab   # once; WEBO_APP_NETWORK if you use another name
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build
# The tunnel is managed remotely: CLOUDFLARE_TUNNEL_TOKEN runs it, and webo writes
# its routes through the API (WEBO_TUNNEL_ID + CLOUDFLARE_* in .env).
services:
  webo:
    container_name: webo
    env_file:
      - path: .env
        required: false
    environment:
      - WEBO_MCP_BIND=0.0.0.0:5051
    ports: !override
      - "${WEBO_TAILSCALE_IP:-127.0.0.1}:5051:5051"
    networks:
      - default
      - apps
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: webo-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - default
      - apps
    depends_on:
      - webo

networks:
  apps:
    external: true
    name: ${WEBO_APP_NETWORK:-homelab}
